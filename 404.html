<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Druyan Design</title>
    <script>
      // GitHub Pages SPA redirect
      var segmentCount = 1;
      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + segmentCount).join('/');
      var route = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoBase + '/?/' + route.replace(/&/g, '~and~') + search + l.hash;
      l.replace(target);
    </script>
  </head>
  <body></body>
</html>
